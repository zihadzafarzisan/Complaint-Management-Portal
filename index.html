
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এবিএম আশরাফ উদ্দিন নিজান এর কার্যালয় - ডিজিটাল যোগাযোগ পোর্টাল</title>
    <meta name="description" content="সংসদ সদস্য এবিএম আশরাফ উদ্দিন নিজান এর সাথে সরাসরি যোগাযোগের অফিসিয়াল ডিজিটাল প্ল্যাটফর্ম। আপনার অভিযোগ ও মতামত দ্রুত সমাধানের জন্য এখানে জমা দিন।">
    <meta name="theme-color" content="#006a4e">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gov-green: #006a4e;
            --gov-red: #f42a41;
        }

        html, body {
            cursor: default;
            -webkit-tap-highlight-color: transparent;
            background-color: #f1f5f9;
        }

        * { caret-color: transparent; }

        input, textarea, [contenteditable="true"] {
            cursor: text !important;
            caret-color: var(--gov-green) !important;
        }

        button, a, .cursor-pointer { cursor: pointer !important; }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            scroll-behavior: smooth;
            color: #1e293b;
        }
        
        .bg-gov-green { background-color: var(--gov-green); }
        .text-gov-green { color: var(--gov-green); }
        .bg-gov-red { background-color: var(--gov-red); }
        .border-gov-green { border-color: var(--gov-green); }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .view-transition {
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gov-green); }
    </style>
